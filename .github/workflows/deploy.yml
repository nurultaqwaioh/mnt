
name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ] # Jalankan otomatis setiap kali push ke branch main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install, build, and upload with Node
        uses: withastro/action@v3
        # Action resmi Astro ini otomatis mendeteksi package manager (npm/yarn/pnpm)
        # dan mem-build folder output ke ./dist secara otomatis
